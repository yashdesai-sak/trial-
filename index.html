const pic=(p,v,b)=>v==0&&IMG[p.id]?IMG[p.id]:art(p,v,b);
const img=(p,v=0,c="im")=>`<img class="${c}" src="${pic(p,v,c=="im")}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src='${FB}'">`;
// UI helpers
function toast(m){const d=document.createElement("div");d.textContent=m;$("#toast").append(d);setTimeout(()=>d.remove(),2200)}
function theme(){const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");r.dataset.theme=cur=="dark"?"light":"dark";SV("theme",r.dataset.theme)}
function modal(h){$("#modal").innerHTML=h?`<div class="md" onclick="if(event.target==this)modal()"><div role="dialog" aria-modal="true"><button class="x" aria-label="Close" onclick="modal()">×</button>${h}</div></div>`:"";if(h)$(".x").focus()}
document.addEventListener("keydown",e=>{if(e.key=="Escape")modal()});
function sizeGuide(){modal(`<h2>Size guide</h2><p class="mut">Measurements in cm. Between sizes? Size up for a relaxed fit.</p><table><tr><th>Size</th><th>Chest</th><th>Length</th><th>Fit</th></tr>${[["XS",86,66,"Slim, 160–166 cm"],["S",92,68,"Regular, 166–172 cm"],["M",98,70,"Regular, 172–178 cm"],["L",104,72,"Regular, 178–184 cm"],["XL",110,74,"Relaxed, 184–190 cm"],["XXL",118,76,"Relaxed, 190+ cm"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table>`)}
function suggest(v){const b=$("#sug");v=v.trim().toLowerCase();if(!v){b.style.display="none";return}
const r=P.filter(p=>p.name.toLowerCase().includes(v)||p.team.toLowerCase().includes(v)).slice(0,5);
b.innerHTML=r.length?r.map(p=>`<a href="#/p/${p.id}" onclick="$('#sug').style.display='none'">${img(p,0,"")}<span>${p.name}<br><span class="mut">${p.season} · ${inr(p.price)}</span></span></a>`).join(""):`<a class="mut">No jerseys match "${v.replace(/</g,"")}"</a>`;b.style.display="block"}
document.addEventListener("click",e=>{if(!e.target.closest(".sbox"))$("#sug").style.display="none"});
// state & actions
const F0={q:"",team:"",cat:"",type:"",league:"",size:"",max:3000,av:"all",disc:0,nw:0,sort:"pop"};let F={...F0};
function nav(o){F={...F0,...o};$("#lk").classList.remove("open");$("#sug").style.display="none";if(location.hash=="#/shop")route();else location.hash="#/shop"}
function setF(k,v){F[k]=v;route(true)}
function wlt(id){const i=wish.indexOf(id);i<0?(wish.push(id),toast("Added to wishlist")):(wish.splice(i,1),toast("Removed from wishlist"));save();route(true)}
function addCart(id,size,qty,cu){const p=byId(id);if(!size||qty<1||stock(p,size)<qty){toast("Pick an in-stock size first");return false}
const nm=cu&&cu.nm||"",no=cu&&cu.no||"";inv[id][size]-=qty;const c=cart.find(c=>c.id==id&&c.size==size&&(c.nm||"")==nm&&(c.no||"")==no);c?c.qty+=qty:cart.push({id,size,qty,nm,no});save();toast(`Added ${qty} × ${p.name} (${size})`);fly(id);return true}
function cq(i,d){const c=cart[i],p=byId(c.id);if(d>0){if(!stock(p,c.size)){toast("No more stock in this size");return}inv[c.id][c.size]--;c.qty++}else{inv[c.id][c.size]++;c.qty--;if(!c.qty)cart.splice(i,1)}save();route(true)}
function rm(i){const c=cart[i];inv[c.id][c.size]+=c.qty;cart.splice(i,1);save();route(true)}
function quickAdd(id){const p=byId(id),s=SZ.find(s=>stock(p,s)>0);s?addCart(id,s,1)&&route(true):toast("Sold out")}
// views
function card(p){const d=disc(p),w=wish.includes(p.id);return `<article class="card" data-id="${p.id}" style="--c:#${gc(p)}"><div class="pw"><a class="ph" href="#/p/${p.id}" aria-label="${p.name}" tabindex="-1">${img(p,0)}</a>${hszH(p)}</div>
<div class="bg">${sold(p)?'<span class="tag k">OUT OF STOCK</span>':""}${p.isNew?'<span class="tag">NEW</span>':""}${d?`<span class="tag r">SALE</span>`:""}</div>
<button class="wl ${w?"on":""}" aria-pressed="${w}" aria-label="Toggle wishlist" onclick="wlt(${p.id})">${w?"♥":"♡"}</button>
<div class="bd"><span class="mut">${p.team} · ${p.season}</span><h3><a href="#/p/${p.id}">${p.name}</a></h3>
<div class="pr"><b>${inr(p.price)}</b>${d?`<s>${inr(p.originalPrice)}</s><em>-${d}%</em>`:""}</div>
